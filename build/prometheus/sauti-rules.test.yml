# Unit tests of sauti-rules.yml, run by `promtool test rules`
# (scripts/ci/promtool.sh; ADR-0041 rule 8). Each alert is shown firing and
# staying quiet, with its input series present, absent and stale. Each service
# runs two instances, one leading and one standing by. A stopped target is
# modelled as Prometheus records it: a stale marker on each of its series.
# promtool compares labels and annotations exactly, so each expected alert
# repeats its rule's annotations (YAML anchors below).
rule_files:
  - sauti-rules.yml

evaluation_interval: 1m

tests:
  # Tier 3 (ADR-0029 rule 8): the age of the oldest unacknowledged escalation.
  - name: an escalation unacknowledged for over 10 minutes pages
    input_series:
      - series: 'sauti_escalation_oldest_unacknowledged_seconds{instance="intake-gw-a"}'
        values: '0+60x13'
      - series: 'sauti_escalation_oldest_unacknowledged_seconds{instance="intake-gw-b"}'
        values: '0x13'
      - series: 'sauti_escalation_gauges_leader{instance="intake-gw-a"}'
        values: '1x13'
      - series: 'sauti_escalation_gauges_leader{instance="intake-gw-b"}'
        values: '0x13'
    alert_rule_test:
      - eval_time: 10m # 600 s is not over 600
        alertname: SautiEscalationUnacknowledged
        exp_alerts: []
      - eval_time: 11m # 660 s, pending for 1m
        alertname: SautiEscalationUnacknowledged
        exp_alerts: []
      - eval_time: 12m
        alertname: SautiEscalationUnacknowledged
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: &unacknowledged
              summary: An escalation has waited over 10 minutes for a coordinator's acknowledgement.
              runbook: docs/runbooks/no-eligible-responders.md
      - eval_time: 13m
        alertname: SautiEscalationSignalStale
        exp_alerts: []

  - name: a leader with nothing waiting is quiet
    input_series:
      - series: 'sauti_escalation_oldest_unacknowledged_seconds{instance="intake-gw-a"}'
        values: '0x5'
      - series: 'sauti_escalation_oldest_unacknowledged_seconds{instance="intake-gw-b"}'
        values: '0x5'
      - series: 'sauti_escalation_gauges_leader{instance="intake-gw-a"}'
        values: '1x5'
      - series: 'sauti_escalation_gauges_leader{instance="intake-gw-b"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: SautiEscalationUnacknowledged
        exp_alerts: []
      - eval_time: 5m
        alertname: SautiEscalationSignalStale
        exp_alerts: []

  # Review Focus 4: the signal is stale, not high.
  - name: no intake-gw series at all is a stale signal
    input_series:
      - series: 'up{job="intake-gw", instance="intake-gw-a"}'
        values: '0x3'
    alert_rule_test:
      - eval_time: 1m
        alertname: SautiEscalationSignalStale
        exp_alerts: []
      - eval_time: 2m
        alertname: SautiEscalationSignalStale
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: &stale
              summary: No intake-gw instance exports a fresh escalation age, so an unacknowledged escalation cannot page.
              runbook: docs/runbooks/escalation-signal-stale.md
      - eval_time: 2m
        alertname: SautiEscalationUnacknowledged
        exp_alerts: []

  - name: every intake-gw stopping is a stale signal
    input_series:
      - series: 'sauti_escalation_gauges_leader{instance="intake-gw-a"}'
        values: '1 1 1 stale'
      - series: 'sauti_escalation_gauges_leader{instance="intake-gw-b"}'
        values: '0 0 0 stale'
      - series: 'sauti_escalation_oldest_unacknowledged_seconds{instance="intake-gw-a"}'
        values: '0 0 0 stale'
      - series: 'sauti_escalation_oldest_unacknowledged_seconds{instance="intake-gw-b"}'
        values: '0 0 0 stale'
    alert_rule_test:
      - eval_time: 2m
        alertname: SautiEscalationSignalStale
        exp_alerts: []
      - eval_time: 4m # stale since 3m, pending
        alertname: SautiEscalationSignalStale
        exp_alerts: []
      - eval_time: 5m
        alertname: SautiEscalationSignalStale
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: *stale

  - name: no intake-gw instance leading is a stale signal
    input_series:
      - series: 'sauti_escalation_gauges_leader{instance="intake-gw-a"}'
        values: '0x3'
      - series: 'sauti_escalation_gauges_leader{instance="intake-gw-b"}'
        values: '0x3'
      - series: 'sauti_escalation_oldest_unacknowledged_seconds{instance="intake-gw-a"}'
        values: '0x3'
      - series: 'sauti_escalation_oldest_unacknowledged_seconds{instance="intake-gw-b"}'
        values: '0x3'
    alert_rule_test:
      - eval_time: 1m
        alertname: SautiEscalationSignalStale
        exp_alerts: []
      - eval_time: 2m
        alertname: SautiEscalationSignalStale
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: *stale
      - eval_time: 2m
        alertname: SautiEscalationUnacknowledged
        exp_alerts: []

  - name: a failover inside the window does not page
    input_series:
      - series: 'sauti_escalation_gauges_leader{instance="intake-gw-a"}'
        values: '1 1 1 stale'
      - series: 'sauti_escalation_gauges_leader{instance="intake-gw-b"}'
        values: '0 0 0 0 1 1 1'
      - series: 'sauti_escalation_oldest_unacknowledged_seconds{instance="intake-gw-a"}'
        values: '0 0 0 stale'
      - series: 'sauti_escalation_oldest_unacknowledged_seconds{instance="intake-gw-b"}'
        values: '0x6'
    alert_rule_test:
      - eval_time: 5m # without the takeover at 4m it would fire here
        alertname: SautiEscalationSignalStale
        exp_alerts: []
      - eval_time: 6m
        alertname: SautiEscalationSignalStale
        exp_alerts: []

  # dispatch-worker: exactly one leader.
  - name: one dispatch leader is quiet
    input_series:
      - series: 'sauti_dispatch_leader{instance="dispatch-worker-a"}'
        values: '1x3'
      - series: 'sauti_dispatch_leader{instance="dispatch-worker-b"}'
        values: '0x3'
    alert_rule_test:
      - eval_time: 3m
        alertname: SautiDispatchLeaderMissing
        exp_alerts: []

  - name: no dispatch leader pages
    input_series:
      - series: 'sauti_dispatch_leader{instance="dispatch-worker-a"}'
        values: '0x3'
      - series: 'sauti_dispatch_leader{instance="dispatch-worker-b"}'
        values: '0x3'
    alert_rule_test:
      - eval_time: 0m
        alertname: SautiDispatchLeaderMissing
        exp_alerts: []
      - eval_time: 1m
        alertname: SautiDispatchLeaderMissing
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: &leader
              summary: dispatch-worker has no leader, or more than one.
              runbook: docs/runbooks/dispatch-worker-down.md

  - name: two dispatch leaders page
    input_series:
      - series: 'sauti_dispatch_leader{instance="dispatch-worker-a"}'
        values: '1x3'
      - series: 'sauti_dispatch_leader{instance="dispatch-worker-b"}'
        values: '1x3'
    alert_rule_test:
      - eval_time: 1m
        alertname: SautiDispatchLeaderMissing
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: *leader

  - name: no dispatch-worker series at all pages
    input_series:
      - series: 'up{job="dispatch-worker", instance="dispatch-worker-a"}'
        values: '0x3'
    alert_rule_test:
      - eval_time: 0m
        alertname: SautiDispatchLeaderMissing
        exp_alerts: []
      - eval_time: 1m
        alertname: SautiDispatchLeaderMissing
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: *leader

  - name: every dispatch-worker stopping pages
    input_series:
      - series: 'sauti_dispatch_leader{instance="dispatch-worker-a"}'
        values: '1 1 stale'
      - series: 'sauti_dispatch_leader{instance="dispatch-worker-b"}'
        values: '0 0 stale'
    alert_rule_test:
      - eval_time: 2m # stale since 2m, pending
        alertname: SautiDispatchLeaderMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: SautiDispatchLeaderMissing
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: *leader

  # dispatch-worker: a fresh overdue age.
  - name: an unreadable overdue age pages
    input_series:
      - series: 'sauti_dispatch_overdue_read_ok{instance="dispatch-worker-a"}'
        values: '0x3'
      - series: 'sauti_dispatch_overdue_read_ok{instance="dispatch-worker-b"}'
        values: '1x3'
    alert_rule_test:
      - eval_time: 1m
        alertname: SautiDispatchOverdueUnreadable
        exp_alerts: []
      - eval_time: 2m
        alertname: SautiDispatchOverdueUnreadable
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              summary: A dispatch-worker instance cannot read the overdue dispatch wakes, so its overdue age is stale.
              runbook: docs/runbooks/dispatch-worker-down.md

  - name: readable overdue ages are quiet
    input_series:
      - series: 'sauti_dispatch_overdue_read_ok{instance="dispatch-worker-a"}'
        values: '1x3'
      - series: 'sauti_dispatch_overdue_read_ok{instance="dispatch-worker-b"}'
        values: '1x3'
    alert_rule_test:
      - eval_time: 3m
        alertname: SautiDispatchOverdueUnreadable
        exp_alerts: []

  # The Watchdog proves the path to the receiver while Prometheus and
  # Alertmanager run; its silence is what pages (the dead man's switch, P0).
  - name: the Watchdog always fires
    input_series:
      - series: 'up{job="intake-gw", instance="intake-gw-a"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 0m
        alertname: Watchdog
        exp_alerts: &watchdog
          - exp_labels: { severity: none }
            exp_annotations:
              summary: Always firing. It proves the path from Prometheus to the receiver; its silence means alerting is down.
              runbook: docs/runbooks/alerting-pipeline-down.md
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts: *watchdog
      - eval_time: 30m
        alertname: Watchdog
        exp_alerts: *watchdog
