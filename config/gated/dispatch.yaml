# Dispatch parameters (Build Prompt §10.4).
# mode "protocol": dispatch stays at ring 1 and escalates to the coordinator
# until the amendment for decisions 1, 2 and 6 is approved (Build Prompt §19).
mode: protocol
ring_step_metres: 500
ring_interval: 60s
max_radius_metres: 2500
cascade_timeout: 90s
red_parallel_count: 3
forward_ack_timeout: 60s
voice_fallback_after: 20s
# Decision 2, protocol answer (Build Prompt §19): the coordinator is alerted
# at 3 minutes for red with a role unaccepted (both modes), or when the
# cascade is exhausted for yellow and green.
red_escalation_after: 3m
# Interim until M3's arrival verification (ADR-0028; rule 14): an incident
# still open this long after its first acceptance is escalated once, so a
# coordinator checks with the caller that help came. PENDING the PI's
# interval; Build Prompt §10.4 asks the caller "at set intervals" (M3).
follow_up_after: 20m
# Stopping rule (Guide §14; O6): red dispatch failure above 15% across 30
# consecutive red incidents suspends dispatch automatically. A failure is a
# red incident with no acceptance before its closure or its escalation for
# lack of one. Resuming needs a logged staff action.
stopping_rule: {window: 30, max_failure_rate: 0.15}
# Decision 4 is OPEN (PI and co-investigators): safe default order.
ranking_order: [zone_distance, response_history, least_recently_dispatched]
ranking_version: default-2026-11-12
