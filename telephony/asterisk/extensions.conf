; Sauti toll-free voice line (Build Prompt §10.2). The carrier delivers the
; DID into this context; the call is handed to the Stasis application that
; ivr-controller serves over ARI. No MixMonitor, Monitor or Record anywhere:
; Sauti records nothing.
[sauti-ivr-inbound]
exten => _X.,1,NoOp(Sauti IVR)
 same => n,Stasis(sauti-ivr)
 same => n,Hangup()
