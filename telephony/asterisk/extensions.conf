; Sauti toll-free voice line (Build Prompt §10.2). The carrier delivers the
; DID into this context; the call is handed to the Stasis application that
; ivr-controller serves over ARI. No MixMonitor, Monitor or Record anywhere:
; Sauti records nothing.

[globals]
; PLACEHOLDER, provisioned in P0: the dial string that rings the on-call
; coordinators (a hunt group behind the SIP trunk). It is configuration of
; the deployment, never a number committed to this repository. Until it is
; set, the fallback plays its message and the dial fails.
SAUTI_COORDINATOR_DIAL=PJSIP/sauti-coordinators-placeholder

; Each inbound context matches the DID with and without a leading '+'
; (carriers differ; confirm the format in P0).
[sauti-ivr-inbound]
exten => _X.,1,NoOp(Sauti IVR)
 same => n,Stasis(sauti-ivr)
 same => n,GotoIf($["${STASISSTATUS}"="FAILED"]?sauti-ivr-fallback,s,1)
 same => n,Hangup()
exten => _+X.,1,NoOp(Sauti IVR)
 same => n,Stasis(sauti-ivr)
 same => n,GotoIf($["${STASISSTATUS}"="FAILED"]?sauti-ivr-fallback,s,1)
 same => n,Hangup()

;; The masked bridge number (Build Prompt §10.5; ADR-0028): responders and
;; callers who call it are served by the outbound application's leader, which
;; recognises them and bridges them through Sauti's number. Nothing is
;; recorded. If the application is unreachable, or the bridge cannot serve
;; the call, a coordinator answers (the fallback below). The trunk should
;; also set send_connected_line=no (defence in depth for rule 5; ADR-0028).
[sauti-bridge-inbound]
exten => _X.,1,NoOp(Sauti masked bridge)
 same => n,Stasis(sauti-alerts,bridge)
 same => n,GotoIf($["${STASISSTATUS}"="FAILED"]?sauti-ivr-fallback,s,1)
 same => n,Hangup()
exten => _+X.,1,NoOp(Sauti masked bridge)
 same => n,Stasis(sauti-alerts,bridge)
 same => n,GotoIf($["${STASISSTATUS}"="FAILED"]?sauti-ivr-fallback,s,1)
 same => n,Hangup()

; Fail safe to a human (Build Prompt §14; hard constraint 14). Reached when
; the Stasis application is not there (ivr-controller down, ARI
; disconnected: STASISSTATUS=FAILED), or when ivr-controller cannot serve a
; call (intake error or timeout, a prompt that cannot be played) and hands
; it over with ARI "continue". Every answer given so far is already
; persisted, and the coordinator can find the incident by the caller's
; redial or the reference.
; The coordinators are tried up to 3 times, 30 s each. Between tries the
; caller hears a hold message, but only when a later try can succeed (busy,
; unanswered, unreachable, congested). Then a closing message says a
; coordinator will call back: ivr-controller recorded the hand-over as an
; escalation (voice_handed_over), which rings the coordinator line until
; someone acknowledges it, whatever this dial did (ADR-0029 rule 3). The
; hold and closing recordings are PENDING copy.
[sauti-ivr-fallback]
exten => s,1,NoOp(Sauti IVR fallback to a coordinator)
 same => n,Answer()
 same => n,Playback(sauti/fallback)
 same => n,Set(TRIES=0)
 same => n(dial),Set(TRIES=$[${TRIES}+1])
 same => n,Dial(${SAUTI_COORDINATOR_DIAL},30)
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
 same => n,GotoIf($[${TRIES}>=3]?closing)
 same => n,GotoIf($["${DIALSTATUS}"="BUSY"|"${DIALSTATUS}"="NOANSWER"|"${DIALSTATUS}"="CHANUNAVAIL"|"${DIALSTATUS}"="CONGESTION"]?hold:closing)
 same => n(hold),Playback(sauti/fallback-hold)
 same => n,Goto(dial)
 same => n(closing),Playback(sauti/fallback-closing)
 same => n(done),Hangup()
