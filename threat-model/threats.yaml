      - internal/platform/wiring/dispatch_integration_test.go::TestEngineCrashAfterTheAttemptClaim
      - internal/platform/wiring/dispatch_integration_test.go::TestEngineFailoverMidCascade
      - internal/platform/wiring/dispatch_integration_test.go::TestEngineDoesNotDeliverAfterADatabaseSuspension
      - internal/platform/pg/opstore/review10_integration_test.go::TestCloseAndMergeWakeDispatch

  - id: T-024
    title: Dispatch facts forged or bypassed (direct table writes, generic appends, another responder's alert)
    stride: Elevation of privilege
    linddun: Non-compliance
    asset: dispatch store and incident log
    hard_constraints: [3, 8, 14]
    mitigations:
      - No runtime role writes a dispatch table; each command is a SECURITY DEFINER function granted to one role
      - The generic append refuses dispatch event types; payloads are identifiers and codes only
      - A responder may accept or decline only their own alert (SA403); the database refuses alerts to ineligible or busy responders
    verified_by:
