      - internal/platform/pg/opstore/review10cr_integration_test.go::TestRegistrationNeedsAStageOfTheGazetteerInForce

  - id: T-019
    title: Free-text landmark used to reach other data or pull an incident across wards
    stride: Elevation of privilege
    asset: operational store
    hard_constraints: [5, 14]
    mitigations:
