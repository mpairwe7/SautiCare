      - internal/intake/service_test.go::TestUSSDWithheldNumberNeverResumes
      - internal/intake/service_test.go::TestUSSDDoesNotResumeAfterWindow

  - id: T-021
    title: Distinct emergencies merged, or a merge used to suppress a call
    stride: Denial of service
    asset: dispatch of each emergency
    hard_constraints: [3, 7, 14]
    mitigations:
      - Merge only by the fixed rule (category, one zone, 15 minutes) at T2, under an advisory lock; never discards a call
      - Every merge is two events in the log and the ledger; a coordinator split (console role only, staff identity) revives the call
      - T1 recomputed exactly on a split, so the study outcome is not distorted
      - A merge carries the call's higher severity (incident.severity_raised) and its escalation to the survivor, so a red or escalated call is never hidden in a green incident
      - Calls located only to their ward are never merged (both are dispatched)
      - The database refuses staff actions, splits and unmerges from every role but the console
      - The database accepts merge_absorbed and severity_raised only for a call merged into the survivor, with that call's stored T1 and its own severity (no forged T1, no unrelated call)
      - Merge candidates are read and locked FOR SHARE, so a survivor closing or split concurrently is seen before the decision (no failed dispatch, no merge outside the window)
    verified_by:
      - internal/intake/dedup_test.go::TestNoMergeAcrossCategories
      - internal/intake/dedup_test.go::TestNoMergeBeyondOneZone
      - internal/intake/dedup_test.go::TestNoMergeAtWardLevel
      - internal/intake/merge_test.go::TestMergedRedCallRaisesGreenSurvivor
      - internal/platform/pg/opstore/dedup_integration_test.go::TestMergeCarriesSeverityAndEscalation
      - internal/platform/pg/opstore/dedup_integration_test.go::TestWardLevelCallsAreNotMerged
      - internal/platform/pg/opstore/merge_integration_test.go::TestOnlyTheConsoleRecordsStaffActions
      - internal/platform/pg/opstore/merge_integration_test.go::TestSeverityRaisedParity
      - internal/platform/pg/opstore/merge_integration_test.go::TestMergeAbsorbedMatchesTheMergedCall
      - internal/platform/pg/opstore/merge_integration_test.go::TestSplitAfterARemerge
      - internal/platform/pg/opstore/dedup_integration_test.go::TestConcurrentCompletionsOneSurvivor
      - internal/platform/pg/opstore/dedup_integration_test.go::TestSplitIncident
      - internal/platform/pg/opstore/dedup_integration_test.go::TestDispatchOrMergeWhileTheSurvivorCloses
      - internal/platform/pg/opstore/dedup_integration_test.go::TestDispatchOrMergeWhileASplitMovesT1
      - tests/e2e/m1_dedup_test.go::TestScenario4ThreeBystandersOneIncident

  - id: T-022
    title: Calls recorded, or the voice line driven by forged ARI events
    stride: Spoofing
    linddun: Disclosure of information
    asset: callers' voices and the voice intake
    hard_constraints: [1, 5, 13]
    mitigations:
      - The ARI client has no record, snoop, bridge or external-media call; the dialplan has no Monitor/Record
      - ARI on loopback only, basic auth with an OpenBao-held password, egress allowlist to the Asterisk host
      - IDs from events restricted to Asterisk's shape before use in a path; event decoding fuzzed
      - A key counts only for the prompt the caller has heard start (playback tracked; the old prompt stopped on the first key)
    verified_by:
      - internal/platform/ari/client_test.go::TestNoRecordingEndpointsUsed
      - internal/platform/ivr/dialplan_test.go::TestDialplanFallsBackToACoordinator
