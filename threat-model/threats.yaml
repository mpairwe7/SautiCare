  - id: T-028
    title: An alert, forward or escalation is sent twice, or never reaches a person (provider outage, crash between claim and send, unanswered coordinator line)
    stride: Denial of service
    linddun: Non-compliance
    asset: the alert ladder and coordinator escalation
    hard_constraints: [14]
    mitigations:
      - Every attempt is claimed once per channel before the provider call; an unknown outcome is never re-sent, and the next rung covers it
      - An alert is delivered only while its responder is still eligible (available, gates in force); a responder who switched off is not rung
      - SMS at 0 s, voice at 20 s, the responder menu at any time; the cascade moves on regardless of channel failures
      - Every escalation rings the coordinator line, retried every 2 minutes until a coordinator presses 1
      - An incident's messages go out as soon as it is planned; a later incident's slow or failing plan never holds them back
      - A coordinator line is held only while its call lasts; an early answer keeps it, an answered call with no key is hung up after the no-input time, and each new term frees lines whose channel Asterisk reports gone (never one it cannot be asked about)
      - A closed or merged incident's forward is neither texted nor called (the claim is ordered against the closure)
    verified_by:
      - internal/dispatch/deliver_test.go::TestAPlannedIncidentSendsWhileLaterOnesPlan
