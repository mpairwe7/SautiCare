  - id: T-029
    title: An acceptance forged or made for another responder (a spoofed menu, voice or bridge caller)
    stride: Spoofing
    linddun: Non-compliance
    asset: alerts and assignments
    hard_constraints: [3, 8, 14]
    mitigations:
      - A responder is recognised only by the keyed hash of their registered number; an ambiguous or unknown number is not recognised
      - The database lets a responder answer only their own alert and serialises a responder's acceptances (one open assignment at a time); the first acceptance per role wins
      - A menu session is pinned to its alert, so a later alert cannot be answered by a replayed choice
