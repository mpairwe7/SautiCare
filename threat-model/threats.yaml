  - id: T-012
    title: A new kind of personal record is created without the DPO (e.g. call audio)
    linddun: Non-compliance
    asset: record categories
    hard_constraints: [12]
    mitigations:
      - No call or consent audio exists; the media store accepts consented interview audio only, with a destruction deadline
      - Strict config decoding; analytic schema changes need the PI (CODEOWNERS)
      - >-
        OPEN GAP: no gate yet requires DPO approval of a new record category; the tests
        below cover the media and configuration controls only. Planned (M5): a
        DPO-owned register of record categories under governance/, the DPO as its
        code owner, and a CI check that fails when a migration creates a table or
        column the register does not list.
    verified_by:
      - internal/platform/pg/schemas_integration_test.go::TestMediaRecordingsRequireDestroyByAndKey
      - internal/config/config_test.go::TestLoadRejectsUnknownField
      - "planned:M5 DPO record-category gate: CI fails a migration that adds a table or column absent from the DPO-owned register"

  - id: T-013
