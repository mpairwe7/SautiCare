# Threat model: STRIDE (security) and LINDDUN (privacy) for Sauti Dispatch.
# Each threat names the hard constraints (Build Prompt §3, 1-14) it protects,
# its mitigations, and the tests that prove them (or planned:<milestone>).
# Validated by threat-model/validate_threats.py, which also fails if any hard
# constraint is not covered. Reviewed at every milestone.
threats:
  - id: T-001
    title: Personal data leaves Uganda through an outbound integration or telemetry
    stride: Information disclosure
    asset: caller and responder identifiers
    hard_constraints: [1, 6]
    mitigations:
      - All outbound HTTP through platform/egress with a host allowlist, checked per redirect hop
      - No messaging-app integrations; no foreign SaaS error tracking or AI
      - nftables default-deny and WireGuard between Ugandan sites (P0)
    verified_by:
      - internal/platform/egress/egress_test.go::TestEgressDeniesUnlistedHost
      - internal/platform/egress/egress_test.go::TestEgressDeniesRedirectToUnlistedHost
      - "planned:M2 SMS template content test (no patient name or clinical field)"
      - "planned:P0 nftables default-deny drill"

  - id: T-002
    title: Intake channel unavailable to a basic-phone caller
    stride: Denial of service
    asset: USSD and IVR intake
    hard_constraints: [2, 14]
    mitigations:
      - The incident exists from the first screen; replies are idempotent per session and input
      - Internal errors still answer the caller and give the free voice line
      - An answer and its consequences (classification, rule-error flag and escalation, out-of-area closure) are one transaction; a retried callback or a redial on either channel records a missing classification or T2 before anything else; the closing "help is coming" screen is never shown without T2
      - Second USSD route (UCC code) and second SIP carrier (M7)
    verified_by:
      - internal/platform/africastalking/ussd_test.go::TestATInternalErrorGivesVoiceLine
      - internal/platform/pg/intake_integration_test.go::TestRetriedCallbackReturnsSameScreenNoSecondEvent
      - internal/intake/atomicity_test.go::TestEveryWriteFailureConverges
      - internal/intake/atomicity_test.go::TestRedialAfterLostT2Dispatches
      - internal/intake/atomicity_test.go::TestCompleteWithoutT2IsAnError
      - internal/platform/pg/opstore/batch_integration_test.go::TestAppendBatchIsAllOrNothing
      - internal/platform/pg/schemas_integration_test.go::TestStackMigratesAfterMainsHistory
      - "planned:M7 second-route failover scenario"

  - id: T-003
    title: Severity lowered or triage silently altered
    stride: Tampering
    asset: incident classification and logic version
    hard_constraints: [3, 11]
    mitigations:
      - Severity ratchet in the Go reducer and in the SQL write path
      - Versioned, fingerprinted configuration behind the amendment gate
      - Signed CEL decision tables with clinical scenarios (M1)
      - An answered Tool 1 field never changes (Go fold and an event-log trigger), so the answers a classification read cannot be rewritten
    verified_by:
      - internal/incident/fold_test.go::TestApplyRejectsSeverityLowering
      - internal/platform/pg/opstore/opstore_integration_test.go::TestAppendRejectsSeverityLowering
      - internal/incident/tool1_test.go::TestApplyRefusesAChangedAnswer
      - internal/platform/pg/opstore/tool1_integration_test.go::TestSQLRefusesAChangedAnswer
      - tools/amendgate/check_test.go::TestCheckFailsGatedChangeWithoutAmendment
      - "planned:M1 rule-signature verification test"

  - id: T-004
    title: Protocol timestamps forged by a handset or application clock
    stride: Tampering
    asset: T1-T7 study clock
    hard_constraints: [4]
    mitigations:
      - The database sets every T-time with clock_timestamp(); Go never supplies one
      - chrony with NTS and a GPS reference per site (P0)
    verified_by:
      - internal/platform/pg/opstore/opstore_integration_test.go::TestOpenIncidentSetsT1FromDatabase
      - internal/platform/pg/opstore/opstore_integration_test.go::TestProjectionMatchesFold
      - "planned:P0 clock offset alarm under 10 ms"

  - id: T-005
    title: Caller's number exposed to a responder, a log or a payload
    linddun: Identifying
    asset: caller phone number
    hard_constraints: [5, 8]
    mitigations:
      - pii.Phone masks every generic rendering; numbers stored only as AES-256-GCM ciphertext bound to their row
      - Log handler redacts number-like runs, including inside errors
      - Masked bridge on Asterisk (M2)
    verified_by:
      - internal/pii/pii_test.go::TestPhoneMasksEverywhere
      - internal/platform/logging/redact_test.go::TestRedactionMasksPhoneInsideErrorValues
      - internal/crypto/crypto_test.go::TestOpenFailsWithSwappedAAD
      - internal/crypto/crypto_test.go::TestSealAndOpenRequireACompleteLocation
      - "planned:M2 responder-facing payload scan and masked bridge test"

  - id: T-006
    title: Coordinator overrides dispatch outside the defined exceptions
    stride: Repudiation
    asset: dispatch decisions
    hard_constraints: [7]
    mitigations:
      - Overrides only in defined exception conditions, each a logged protocol deviation (M5)
      - Every decision is an event mirrored into the hash-chained audit ledger
    verified_by:
      - internal/platform/pg/relay_integration_test.go::TestRelayEndToEndAgainstPostgres
      - "planned:M5 override-requires-deviation test"

  - id: T-007
    title: Audit history rewritten, truncated or forged
    stride: Tampering
    asset: audit ledger
    hard_constraints: [8]
    mitigations:
      - SHA-256 hash chain computed in SQL and re-verified in Go
      - Append-only triggers even for the owner; EXECUTE-only appender role
      - ML-DSA-65 signed checkpoints written to a write-once witness; verification requires the witness, and an empty or missing witness fails it unless --no-witness is explicit
      - The checkpointer is anchored on the last witnessed checkpoint and refuses to sign over diverged history; every checkpoint writer reads the shared witness again before signing and checks each note it has not seen against the chain
    verified_by:
      - internal/platform/pg/auditstore/auditstore_integration_test.go::TestSQLHashMatchesGoCanonical
      - internal/platform/pg/auditstore/auditstore_integration_test.go::TestOwnerUpdateBlockedByTrigger
      - internal/audit/verify_test.go::TestVerifyDetectsBrokenHash
      - internal/audit/verify_test.go::TestVerifyDetectsTruncationBeyondCheckpoint
      - internal/audit/verify_test.go::TestVerifyDetectsForgedCheckpoint
      - tests/e2e/m0_fixture_test.go::TestM0FixtureIncident
      - internal/platform/pg/tamper_integration_test.go::TestOwnerRewriteWithRecomputedChainIsCaughtByWitness
      - internal/audit/witness_test.go::TestCheckpointerRefusesDivergedChain
      - internal/audit/witness_test.go::TestRelayCheckpointRefusesARewriteBehindAManualCheckpoint
      - internal/audit/witness_test.go::TestCheckpointerChecksEveryNewWitnessNote
      - cmd/sautictl/checkpoint_integration_test.go::TestRelayCheckpointRefusesARewriteBehindTheCommandsCheckpoint
      - cmd/sautictl/main_test.go::TestVerifyLedgerRequiresWitnessOrExplicitOptOut
      - cmd/sautictl/ledger_test.go::TestVerifyLedgerFailsWhenTheWitnessDirHoldsNoNotes

  - id: T-008
    title: Caller identifiers enter the audit ledger
    linddun: Data disclosure
    asset: audit ledger (5-year retention)
    hard_constraints: [8]
    mitigations:
      - Outbox carries only typed fields and the payload hash; strict decoding stops on unknown keys
      - The payload hash is salted with a per-event random value kept in the operational store, so it cannot be reversed by enumerating numbers
    verified_by:
      - internal/platform/pg/relay_integration_test.go::TestAuditEntryNeverCarriesPayloadContent
      - internal/audit/relay_test.go::TestRelayAbortsOnPoisonRow
      - internal/platform/pg/opstore/opstore_integration_test.go::TestOutboxPayloadHasOnlyAllowedKeys
      - internal/platform/pg/opstore/opstore_integration_test.go::TestAuditPayloadHashIsSalted

  - id: T-009
    title: Re-identification by joining operational and research data
    linddun: Linking
    asset: operational, analytic and linkage stores
    hard_constraints: [9]
    mitigations:
      - Five databases; CONNECT revoked from PUBLIC; per-store roles
      - Only the pseudonymiser links both stores (archcheck R4)
      - Linkage vault resolves only for four lawful reasons, every attempt logged
    verified_by:
      - internal/platform/pg/bootstrap/bootstrap_integration_test.go::TestBootstrapIsolatesStores
      - tools/archcheck/check_test.go::TestR4OnlyPseudonymiserJoinsStores
      - internal/platform/pg/schemas_integration_test.go::TestLinkageResolveRequiresAllowedReason
      - internal/platform/pg/schemas_integration_test.go::TestLinkageRolesAreNarrow

  - id: T-010
    title: Research export includes a person who did not consent or withdrew
    linddun: Non-compliance
    asset: analytic store
    hard_constraints: [10]
    mitigations:
      - Analytic rows require consent, permission/assent or a waiver with its reason
      - Append-only suppression ledger replayed after every restore (M6)
    verified_by:
      - internal/platform/pg/schemas_integration_test.go::TestAnalyticRejectsUnconsentedRecord
      - internal/platform/pg/schemas_integration_test.go::TestSuppressionLedgerAppendOnly
      - "planned:M6 restore replays suppression ledger (scenario 16)"

  - id: T-011
    title: Gated protocol parameters changed during the study window
    stride: Tampering
    asset: triage rules, dispatch parameters, SMS templates, flags
    hard_constraints: [11]
    mitigations:
      - amendgate in CI requires an amendment record matching the exact content hash
    verified_by:
      - tools/amendgate/check_test.go::TestCheckFailsGatedChangeWithoutAmendment
      - tools/amendgate/check_test.go::TestCheckFailsWhenHashDiffersFromAmendment
      - tools/amendgate/check_test.go::TestEffectiveGlobsCannotShrink
      - tools/amendgate/check_test.go::TestGatedSymlinkIsRejected

  - id: T-012
    title: A new kind of personal record is created without the DPO (e.g. call audio)
    linddun: Non-compliance
    asset: record categories
    hard_constraints: [12]
    mitigations:
      - No call or consent audio exists; the media store accepts consented interview audio only, with a destruction deadline
      - Strict config decoding; analytic schema changes need the PI (CODEOWNERS)
      - >-
        OPEN GAP: no gate yet requires DPO approval of a new record category; the tests
        below cover the media and configuration controls only. Planned (M5): a
        DPO-owned register of record categories under governance/, the DPO as its
        code owner, and a CI check that fails when a migration creates a table or
        column the register does not list.
    verified_by:
      - internal/platform/pg/schemas_integration_test.go::TestMediaRecordingsRequireDestroyByAndKey
      - internal/config/config_test.go::TestLoadRejectsUnknownField
      - "planned:M5 DPO record-category gate: CI fails a migration that adds a table or column absent from the DPO-owned register"

  - id: T-013
    title: Production reached from outside Uganda (vendor or remote staff)
    stride: Elevation of privilege
    asset: production platform
    hard_constraints: [13]
    mitigations:
      - Access only from Uganda over WireGuard; Keycloak passkeys; support contracts with no personal-data access (P0)
      - Development keys refuse production
    verified_by:
      - internal/platform/devkeys/devkeys_test.go::TestDevkeysRefuseProduction
      - cmd/sautictl/main_test.go::TestKeygenRefusesProduction
      - "planned:P0 access-path and geo-restriction drill"

  - id: T-014
    title: Dispatch blocked by an audit, analytics or monitoring outage
    stride: Denial of service
    asset: dispatch path
    hard_constraints: [14]
    mitigations:
      - Transactional outbox; the relay retries without blocking writers
      - Readiness checks only dispatch-path dependencies
      - Every operational and audit store call has its own deadline, pool wait included, so a stalled store cannot hang the relay
    verified_by:
      - internal/audit/relay_test.go::TestRelayCatchesUpAfterLedgerOutage
      - internal/platform/health/health_test.go::TestReadyFailsWhenACheckFails
      - internal/platform/pg/relay_integration_test.go::TestSingleActiveRelayLeader
      - internal/platform/pg/auditstore/auditstore_integration_test.go::TestEveryLedgerCallHasItsOwnDeadline
      - internal/platform/pg/opstore/review3cr_integration_test.go::TestOpstoreCallsHaveTheirOwnDeadline

  - id: T-015
    title: Forged USSD callbacks inject fake incidents
    stride: Spoofing
    asset: intake gateway
    hard_constraints: [2]
    mitigations:
      - Secret path token compared in constant time; service-code allowlist; source-IP allowlist at HAProxy (P0)
    verified_by:
      - internal/platform/africastalking/ussd_test.go::TestATBadTokenIs404
      - internal/platform/africastalking/ussd_test.go::TestATUnknownServiceCodeIs403
      - "planned:P0 HAProxy source allowlist configuration test"

  - id: T-016
    title: Triage rules altered without clinical sign-off, or a table with gaps runs
    stride: Tampering
    asset: triage decision table
    hard_constraints: [3, 11, 14]
    mitigations:
      - ML-DSA-65 signature (context sauti-triage-rules/v1) against trusted keys held in gated, fingerprinted config
      - Totality check over every input combination at load, after the domain is bounded at 9^4; catalogue and bundle domains must match
      - Runtime error or no match gives red, flagged and escalated; production refuses dev-signed or pending bundles
    verified_by:
      - internal/triage/triage_test.go::TestLoadRejectsBadSignature
      - internal/triage/triage_test.go::TestLoadRejectsUntrustedKey
      - internal/triage/triage_test.go::TestLoadRejectsNonTotalTable
      - internal/triage/triage_test.go::TestLoadRejectsOversizedDomain
      - internal/crypto/crypto_test.go::TestSignatureContextsAreSeparated
      - internal/platform/wiring/intake_integration_test.go::TestBuildIntakeRefusesPlaceholdersInProduction

  - id: T-017
    title: A caller's number or typed landmark recovered from step keys, events or the audit hash
    stride: Information disclosure
    linddun: Identifiability
    asset: callback number, free-text landmark
    hard_constraints: [5, 8]
    mitigations:
      - Screen answers are codes only, enforced identically in Go and SQL; identifiers sealed to their own row and referenced by ID
      - USSD step keys are HMACs under a dedicated HKDF info, never sha256(text)
      - "Planned (M6): identifiers shredded with their key period; until the retention agent destroys a key period, identifiers sealed under it stay decryptable"
    verified_by:
      - "planned:M6 key-period destruction by the retention agent (crypto-shredding)"
      - internal/incident/tool1_test.go::TestApplyScreenAnsweredRejectsInvalidPayloads
      - internal/platform/pg/opstore/tool1_integration_test.go::TestSQLRejectsWhatFoldRejects
      - internal/crypto/crypto_test.go::TestStepMACIsKeyedAndSeparated
      - internal/platform/pg/opstore/identifiers_integration_test.go::TestStoreIdentifierIsIdempotentAndBound
      - tests/e2e/m1_intake_test.go::TestNoCallerNumberInLogs

  - id: T-018
    title: Gazetteer edited in place, sending responders to the wrong zone
    stride: Tampering
    asset: wards, landmarks and their cells
    hard_constraints: [11]
    mitigations:
      - Versions immutable even for the owner (triggers refuse UPDATE, DELETE, TRUNCATE, and INSERT under a published version); new version plus deviation record
      - The gazetteer file is gated by the amendment gate; production refuses a placeholder
    verified_by:
      - internal/platform/pg/opstore/gazetteer_integration_test.go::TestGazetteerIsFrozen
      - internal/platform/pg/opstore/gazetteer_integration_test.go::TestGazetteerLoadIsIdempotentPerVersion
      - internal/location/gazetteer_test.go::TestRepositoryGazetteer

  - id: T-019
    title: Free-text landmark used to reach other data or pull an incident across wards
    stride: Elevation of privilege
    asset: operational store
    hard_constraints: [5, 14]
    mitigations:
      - Matching only through op.match_landmark, parameterised, scoped to the caller's ward; pg_trgm in a schema runtime roles cannot use
      - Text limited to 20 GSM characters; never logged; sealed
    verified_by:
      - internal/platform/pg/opstore/gazetteer_integration_test.go::TestMatchIsScopedToWard
      - internal/platform/pg/opstore/gazetteer_integration_test.go::TestRuntimeRolesCannotReachTrigramFunctions
      - internal/intake/machine_test.go::TestFreeTextLandmark

  - id: T-020
    title: A redial resumes someone else's incident
    stride: Spoofing
    linddun: Linkability
    asset: incident record
    hard_constraints: [5]
    mitigations:
      - Resume only by keyed hash of the caller's own number, within the window, for an open unfinished incident; a withheld number never resumes
    verified_by:
      - internal/platform/pg/opstore/resume_integration_test.go::TestFindResumable
      - internal/intake/service_test.go::TestUSSDWithheldNumberNeverResumes
      - internal/intake/service_test.go::TestUSSDDoesNotResumeAfterWindow

  - id: T-021
    title: Distinct emergencies merged, or a merge used to suppress a call
    stride: Denial of service
    asset: dispatch of each emergency
    hard_constraints: [3, 7, 14]
    mitigations:
      - Merge only by the fixed rule (category, one zone, 15 minutes) at T2, under an advisory lock; never discards a call
      - Every merge is two events in the log and the ledger; a coordinator split (console role only, staff identity) revives the call
      - T1 recomputed exactly on a split, so the study outcome is not distorted
      - A merge carries the call's higher severity (incident.severity_raised) and its escalation to the survivor, so a red or escalated call is never hidden in a green incident
      - Calls located only to their ward are never merged (both are dispatched)
      - The database refuses staff actions, splits and unmerges from every role but the console
      - The database accepts merge_absorbed and severity_raised only for a call merged into the survivor, with that call's stored T1 and its own severity (no forged T1, no unrelated call)
      - Merge candidates are read and locked FOR SHARE, so a survivor closing or split concurrently is seen before the decision (no failed dispatch, no merge outside the window)
    verified_by:
      - internal/intake/dedup_test.go::TestNoMergeAcrossCategories
      - internal/intake/dedup_test.go::TestNoMergeBeyondOneZone
      - internal/intake/dedup_test.go::TestNoMergeAtWardLevel
      - internal/intake/merge_test.go::TestMergedRedCallRaisesGreenSurvivor
      - internal/platform/pg/opstore/dedup_integration_test.go::TestMergeCarriesSeverityAndEscalation
      - internal/platform/pg/opstore/dedup_integration_test.go::TestWardLevelCallsAreNotMerged
      - internal/platform/pg/opstore/merge_integration_test.go::TestOnlyTheConsoleRecordsStaffActions
      - internal/platform/pg/opstore/merge_integration_test.go::TestSeverityRaisedParity
      - internal/platform/pg/opstore/merge_integration_test.go::TestMergeAbsorbedMatchesTheMergedCall
      - internal/platform/pg/opstore/merge_integration_test.go::TestSplitAfterARemerge
      - internal/platform/pg/opstore/dedup_integration_test.go::TestConcurrentCompletionsOneSurvivor
      - internal/platform/pg/opstore/dedup_integration_test.go::TestSplitIncident
      - internal/platform/pg/opstore/dedup_integration_test.go::TestDispatchOrMergeWhileTheSurvivorCloses
      - internal/platform/pg/opstore/dedup_integration_test.go::TestDispatchOrMergeWhileASplitMovesT1
      - tests/e2e/m1_dedup_test.go::TestScenario4ThreeBystandersOneIncident
