  - id: T-018
    title: Gazetteer edited in place, sending responders to the wrong zone
    stride: Tampering
    asset: wards, landmarks and their cells
    hard_constraints: [11]
    mitigations:
      - Versions immutable even for the owner (triggers refuse UPDATE, DELETE, TRUNCATE); new version plus deviation record
      - The gazetteer file is gated by the amendment gate; production refuses a placeholder (intake and dispatch-worker)
