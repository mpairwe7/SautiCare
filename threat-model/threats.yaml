      - internal/platform/pg/opstore/dispatch_integration_test.go::TestIssueAlertGuards
      - internal/incident/dispatch_test.go::TestDispatchEventPayloads

  - id: T-025
    title: Dispatch silently stopped, or suspended or resumed without a trace
    stride: Repudiation
    linddun: Non-compliance
    asset: dispatch control and the reportable-events register
    hard_constraints: [8, 14]
    mitigations:
      - Suspending and resuming need the console role and a staff identity; the leader may only suspend on a stopping-rule breach
      - The control log is append-only (SA403); every change is an audit-ledger entry
      - While suspended every incident is escalated to a coordinator; production refuses the unapproved suspended message
      - While suspended the database refuses alerts, forwards and alert attempts under a lock a committing suspension holds
      - A pass the worker cannot process is escalated (dispatch_error); a stopping-rule rate that is not a number strictly between 0 and 1 is refused at start-up
    verified_by:
