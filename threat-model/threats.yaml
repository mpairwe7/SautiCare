      - internal/platform/ari/client_test.go::TestClientRejectsWrongCredentials
      - internal/platform/ari/client_test.go::TestClientAnswersPlaysAndHangsUp
      - tests/e2e/m1_ivr_test.go::TestScenario5FinishOnIVR
      - "planned:P0 nftables keeps Asterisk HTTP on loopback; ARI credential in OpenBao"

  - id: T-023
    title: A role taken twice, or a responder alerted twice, by concurrent accepts, retries, a crash or a failover
    stride: Tampering
    linddun: Non-repudiation
    asset: dispatch decisions (alerts, assignments, deliveries)
    hard_constraints: [3, 14]
    mitigations:
      - First acceptance per role is a partial unique index; accepts serialise on the incident row, then on the responder row (one open assignment per responder)
      - One alert per responder per incident (UNIQUE); every dispatch fact and its event in one function
      - Each delivery attempt is claimed in the store before the provider call and never sent again (at most once; an unfinished claim lapses to the next rung)
      - The worker keeps no dispatch state; leases and a generation guard make every pass retry-safe; a restarted worker reclaims a failed pass when its lease expires
    verified_by:
      - internal/platform/pg/opstore/dispatch_integration_test.go::TestConcurrentAcceptsOneAssignment
      - internal/platform/pg/opstore/review10cr_integration_test.go::TestAcceptsSerialisePerResponder
      - internal/platform/pg/opstore/dispatch_integration_test.go::TestAttemptsAreClaimedOnce
      - internal/platform/pg/opstore/dispatch_integration_test.go::TestDispatchTimers
