  - id: T-030
    title: Someone calls the bridge number pretending to be a responder or a caller, to reach the other party
    stride: Spoofing
    linddun: Identifying
    asset: the masked bridge
    hard_constraints: [5]
    mitigations:
      - The bridge connects only a number whose keyed hash matches a responder with an open assignment, or a number that a session of an open incident (or of a report merged into it, until a split) came from; anyone else hears the same "nothing to connect" message, so the bridge reveals nobody's registration
      - Neither party ever learns the other's number; a spoofed caller ID reaches only the voice of the other party, never a number or a record
    verified_by:
      - internal/platform/ivr/bridge_test.go::TestBridgeUnknownNumber
