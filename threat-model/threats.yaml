      - internal/platform/pg/opstore/control_integration_test.go::TestAutoSuspendRegistersTheBreach
      - internal/dispatch/stopping_test.go::TestStoppingRuleBoundaries
      - internal/intake/suspension_test.go::TestSuspendedDispatchChangesTheClosingMessageAndEscalates
      - cmd/sautictl/main_test.go::TestDispatchCommandsGateAndValidate
      - internal/platform/wiring/dispatch_integration_test.go::TestEngineRunOnceEscalatesAnUnprocessableIncident
      - internal/platform/pg/opstore/control_integration_test.go::TestRedDispatchOutcomes
      - internal/platform/pg/opstore/review10_integration_test.go::TestNoAlertOrAttemptWhileSuspended
      - internal/platform/pg/opstore/review10cr_integration_test.go::TestNoForwardOrAlertOnceASuspensionCommits
      - internal/platform/wiring/dispatch_integration_test.go::TestEngineDoesNotForwardAfterADatabaseSuspension
      - internal/dispatch/stopping_test.go::TestStoppingRuleRefusesANaNRate
      - internal/intake/watchdog_test.go::TestWatchdogEscalatesStalledDispatch
      - cmd/dispatch-worker/main_test.go::TestReadinessFailsWhenTheLeaderStalls
  - id: T-026
    title: Patient data or the caller's number reaches a responder, a facility or a messaging channel through SMS or voice
    stride: Information disclosure
    linddun: Disclosure of information
    asset: SMS and outbound-call content; the caller's and responders' numbers
    hard_constraints: [5, 6]
    mitigations:
      - Templates are gated config; each may carry only its own placeholders, and the value type has no field for a name, a clinical answer or a number
      - Templates refuse digit runs, non-GSM-7 text and a second segment; production refuses PENDING copy
      - Ward and landmark appear only in the amended templates (decision 1, behind the amendment gate)
      - Caller notices go only to the caller's sealed number; responder messages only to the responder's number; numbers are unsealed in memory only
      - Provider errors and logs carry neither the number nor the API key; outbound calls never record, snoop or bridge
    verified_by:
      - internal/config/sms_test.go::TestSMSTemplatesAreCompliant
      - internal/config/sms_test.go::TestProductionReadyRefusesPendingSMS
      - internal/platform/channels/sms_test.go::TestAlertSMS
