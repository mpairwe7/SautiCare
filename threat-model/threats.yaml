  - id: T-020
    title: A redial resumes someone else's incident
    stride: Spoofing
    linddun: Linkability
    asset: incident record
    hard_constraints: [5]
    mitigations:
      - Resume only by keyed hash of the caller's own number, within the window, for an open unfinished incident; a withheld number never resumes
    verified_by:
