  - id: T-031
    title: The bridge exposes the caller's number (caller ID, logs, payloads, a recording)
    stride: Information disclosure
    linddun: Disclosure of information
    asset: the caller's and responders' numbers
    hard_constraints: [5, 8]
    mitigations:
      - Each leg shows Sauti's number; the calling party's caller ID is set to Sauti's before it joins the bridge, so no connected-line update carries the real number (the trunk should also set send_connected_line=no); a number is opened only to dial it and never logged; the bridge log holds identifiers only
      - The ARI client can create only plain mixing bridges — no recording, snooping or external media
