    stride: Information disclosure
    linddun: Identifiability
    asset: callback number, free-text landmark
    hard_constraints: [5, 8]
    mitigations:
      - Screen answers are codes only, enforced identically in Go and SQL; identifiers sealed to their own row and referenced by ID
      - USSD step keys are HMACs under a dedicated HKDF info, never sha256(text)
      - Identifiers shredded with their key period
    verified_by:
