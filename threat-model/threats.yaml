  - id: T-027
    title: Forged SMS delivery reports or responder-menu answers (a spoofed provider callback or a number not on the registry)
    stride: Spoofing
    linddun: Non-compliance
    asset: alert attempts and assignments
    hard_constraints: [8, 14]
    mitigations:
      - Delivery reports arrive only on a secret path; only status and failure codes are kept and a final report is never overwritten; an unknown message ID changes nothing
      - The responder menu recognises a registered responder by the keyed hash of their number; a responder may answer only their own alert, and the first acceptance wins in the database
      - A retried menu callback gets the answer the first one got (a repeated decline reads the stored outcome without writing); a responder with an open assignment sees it first
